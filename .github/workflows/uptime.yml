name: uptime-evidence

on:
  workflow_dispatch:        # sementara HANYA manual. Cron ditambah setelah diukur.
  schedule:
    - cron: '19,49 * * * *'     # setiap hari setiap jam dimenit 19&49

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # if: always() agar artefak terunggah saat test gagal
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bukti-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90
